# v로 시작하는 태그(v0.1.0 등)를 올리면 GitHub의 맥 서버에서 dmg를 만들어 Releases에 올린다
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # Releases에 파일을 올리려면 필요

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # 유료 인증서가 없으니 키체인을 뒤지지 않고 임시 서명만
