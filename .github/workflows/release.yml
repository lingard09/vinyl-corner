# GitHub의 맥 서버에서 dmg를 만들어 Releases에 올린다
# - v로 시작하는 태그(v0.1.0 등)를 올리거나
# - Actions 탭 → release → "Run workflow"를 누르면 실행된다
# 릴리스 이름과 태그는 package.json의 version으로 정해진다 (0.1.0 → v0.1.0)
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # Releases에 파일을 올리려면 필요

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run adapter # 브라우저 재생 읽기용 mediaremote-adapter 빌드 (러너에 cmake 있음)
      # 공개 릴리스는 태그가 먼저 있어야 한다. 버튼으로 실행했을 때는 태그가 없으니 version으로 만들어 올린다
      # (GITHUB_TOKEN으로 올린 태그는 이 워크플로를 다시 실행시키지 않는다)
      - name: create tag if missing
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          # 초안을 먼저 하나 만들어 둔다. 없으면 파일 올리기가 동시에 시작되며 초안이 두 개 생긴다
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "${TAG#v}" --notes ""
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # 유료 인증서가 없으니 키체인을 뒤지지 않고 임시 서명만
