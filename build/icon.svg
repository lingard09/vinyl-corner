<circle cx="0" cy="0" r="195" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
<circle cx="0" cy="0" r="204" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>
<circle cx="0" cy="0" r="213" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
<circle cx="0" cy="0" r="222" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>
<circle cx="0" cy="0" r="231" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
<circle cx="0" cy="0" r="240" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>
<circle cx="0" cy="0" r="249" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
<circle cx="0" cy="0" r="258" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>
<circle cx="0" cy="0" r="267" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
<circle cx="0" cy="0" r="276" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>
<circle cx="0" cy="0" r="285" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
<circle cx="0" cy="0" r="294" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>
<circle cx="0" cy="0" r="303" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
<circle cx="0" cy="0" r="312" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>
      <!-- 빛 반사 두 줄기 -->
      <path d="M0 0 L-150 -294 A330 330 0 0 1 -60 -324 Z" fill="#ffffff" opacity="0.10"/>
      <path d="M0 0 L150 294 A330 330 0 0 1 60 324 Z" fill="#ffffff" opacity="0.07"/>
      <!-- 라벨 -->
      <circle r="118" fill="url(#label)"/>
      <circle r="118" fill="none" stroke="#000" stroke-opacity="0.15" stroke-width="4"/>
      <path d="M-70 -30 A80 80 0 0 1 40 -78" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>
      <circle r="16" fill="#efe6d2"/>
    </g>

    <!-- 톤암: 오른쪽 위 받침에서 판 바깥쪽 홈으로 -->
    <g filter="url(#shadow)">
      <circle cx="790" cy="245" r="62" fill="#2a2a2a"/>
      <circle cx="790" cy="245" r="62" fill="none" stroke="#bcbcbc" stroke-width="8"/>
      <circle cx="790" cy="245" r="20" fill="#d9d9d9"/>
      <path d="M790 245 L790 560 Q790 640 712 690" fill="none" stroke="url(#arm)" stroke-width="22" stroke-linecap="round"/>
      <rect x="664" y="672" width="70" height="100" rx="12" transform="rotate(38 699 722)" fill="#2a2a2a" stroke="#bcbcbc" stroke-width="7"/>
    </g>
