<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf3df"/>
      <stop offset="1" stop-color="#ead9b4"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.8" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </radialGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#e2452c"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/>
      <stop offset="1" stop-color="#9c9c9c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#5a4320" flood-opacity="0.35"/>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <!-- 바탕: 크림색 둥근 사각형 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <g clip-path="url(#body)">
    <!-- 판 -->
    <g transform="translate(470 545)" filter="url(#shadow)">
      <circle r="330" fill="url(#disc)"/>
      <circle cx="0" cy="0" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>
<circle cx="0" cy="0" r="159" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
